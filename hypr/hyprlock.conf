source = colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    # path = /home/rohith/Pictures/wallpaper/lockscreen.png   
    path = /home/rohith/Pictures/wallpaper/art.png   
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 
    dots_spacing = 0.15 
    dots_center = true
    dots_rounding = -1 
    outer_color = rgb(000000)
    inner_color = rgb(000000)
    font_color = rgb(FFFFFF)
    fade_on_empty = true
    fade_timeout = 1000 
    placeholder_text = <i>Input Password...</i> 
    hide_input = false
    rounding = 40 

    check_color = black
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> 
    fail_transition = 300 
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 
    invert_numlock = false 
    swap_font_color = false
    position = 0, 100
    halign = center
    valign = bottom
    shadow_passes = 10
    shadow_size = 20
    shadow_color = black
    shadow_boost = 1.6
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color= rgb(000000)
    font_size = 55
    font_family = Fira Semibold
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = $on_surface
    font_size = 20
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
